    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      아래 태그들은 홈 기준 기본값이다. 경로별 값은 src/lib/seo.ts 의 setMeta 가
      라우팅 때마다 덮어쓴다. JS 를 실행하지 않는 크롤러는 이 값을 읽는다.
      %SITE_URL% 은 vite.config.ts 가 빌드 시 채운다.
    -->
    <title>자카르타 한마음교회 (Jakarta Hanmaeum Church)</title>
    <meta name="description" content="인도네시아 자카르타 한마음교회 공식 홈페이지 - 삼위일체 하나님을 예배하고, 기도하며, 말씀을 배우고 행하는 공동체" />
    <meta name="theme-color" content="#3b5fc0" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="자카르타 한마음교회" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="자카르타 한마음교회 (Jakarta Hanmaeum Church)" />

    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="자카르타 한마음교회 (Jakarta Hanmaeum Church)" />
    <meta name="twitter:description" content="인도네시아 자카르타 한마음교회 공식 홈페이지 - 삼위일체 하나님을 예배하고, 기도하며, 말씀을 배우고 행하는 공동체" />
    <meta name="twitter:image" content="%SITE_URL%/og-default.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Church",

        "logo": "%SITE_URL%/logo_hmc.png",

        "telephone": "+62-21-739-5035",

    <!--
      Google Fonts. 스타일시트 크기는 그대로 다운로드 시간이므로 작게 유지한다.
      한글 폰트는 유니코드 구간별로 쪼개져 있어 굵기 하나가 곧 @font-face 124개다.
      그래서 굵기를 낱개(400;500;600;700)로 받지 않고 가변축(400..700)으로 받는다.
      구간당 파일 하나로 400~700 전 굵기가 해결된다.
        낱개 3패밀리:  847 KB (gzip 202 KB), @font-face 1150개
        가변축 2패밀리: 191 KB (gzip  47 KB), @font-face  248개
      IBM Plex Sans KR 은 --font-sans 에서 Noto Sans KR 뒤 대체용으로만 있어
      사실상 한 번도 그려지지 않았다. 그래서 뺐다.
      Noto Serif KR 은 PageHeader·홈·인사말 제목에서 실제로 쓴다(600·700만).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      예전의 media="print" + onload 로 media 를 바꾸는 비차단 로드는 CSP 가 강제되며
      인라인 핸들러가 막혀 글꼴이 아예 적용되지 않았다(2026-10-08). CSS 가 gzip 47 KB
      정도라 그냥 받는다. display=swap 이라 글꼴이 늦어도 글은 먼저 보인다.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&family=Noto+Serif+KR:wght@600..700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
